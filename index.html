<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyrenian House — Figure Morph Test</title>

    <style>
        @font-face {
            font-family: "Satisfy";
            src: url("fonts/Satisfy/Satisfy-Regular.ttf") format("truetype");
        }

        @font-face {
            font-family: "Raleway";
            src: url("fonts/Raleway/static/Raleway-Regular.ttf") format("truetype");
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
        }

        .page-container {
            width: 100%;
            min-height: 100vh;
        }

        .top-banner {
            height: 14vh;
            background: #fff;
            /* background-image: url('images/Cyr-house-top-banner-no-logo.png');
            background-size: contain;
            background-position: center top;
            background-repeat: no-repeat; */
            display: grid;
            grid-template-columns: 1.4fr 3fr 0.6fr;
            align-items: center;
            padding-right: 2%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .second-top-banner {
            display: none;
            box-sizing: border-box;
        }

        .main-content {
            min-height: calc(100vh - 14vh);

        }

        .desktop-main-image {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }

        .tablet-main-image {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }


        .message-content {
            height: 100%;
            margin-left: auto;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;

            text-align: right;
        }


        .message-words {
            font-family: "Satisfy", cursive;
            font-size: 48px;
            line-height: 1.1;
        }

        .message-words,
        #cy-logo {
            display: block;

        }

        #cy-logo {
            opacity: 0;
            width: 260px;
            height: auto;
            margin-right: 440px;

        }


        .top-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            white-space: nowrap;
            font-family: "Raleway", sans-serif;
        }

        .top-nav a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .top-nav a:hover {
            color: #ef4138;
        }

        .search-icon {
            position: relative;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .search-icon::before {
            content: "";
            position: absolute;
            left: 1px;
            top: 1px;
            width: 10px;
            height: 10px;
            border: 2px solid #333;
            border-radius: 50%;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            left: 12px;
            top: 12px;
            width: 7px;
            height: 2px;
            background: #333;
            transform: rotate(45deg);
            transform-origin: left center;
        }

        .hamburger {
            width: 68px;
            height: 68px;
            background: #ef4138;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            justify-self: end;
            cursor: pointer;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: #fff;
        }

        svg {
            width: auto;
            height: 100%;
            overflow: hidden;
        }

        #gray-figure,
        #red-figure {
            visibility: hidden;
        }

        button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .animation-container {
            width: 900px;
            height: 100%;

            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0;
            box-sizing: border-box;


        }

        #figure-stage {
            position: relative;
            width: auto;
            height: 100%;
            aspect-ratio: 328.34791 / 231.51042;
            overflow: hidden;
        }

        #figure-box {
            position: absolute;
            left: 18%;
            top: 40%;
            width: 35%;
            height: 37%;
            background: #333;
            z-index: 0;
        }

        #figure-stage svg {
            position: relative;
            z-index: 1;
            width: auto;
            height: 100%;
            overflow: hidden;
        }

        .mobile-main-image {
            display: none;
        }

        @media (max-width: 1000px) {

            .top-banner .top-nav {
                display: none;

            }

            .second-top-banner {
                display: flex;
                width: 100%;
                height: 10vh;
                align-items: center;
                justify-content: center;
            }

            .desktop-main-image {
                display: none;
            }


            .tablet-main-image {
                display: block;
                width: 100%;
                height: auto;
                margin: 0;
            }

            .hamburger {
                justify-self: end;
                transform: translateX(-5%);
            }

        }

        @media (max-width: 375px) {

            .top-banner {
                height: 14vh;
                padding-left: 0;
                padding-right: 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .animation-container {
                width: auto;
                height: 100%;
                flex-shrink: 1;
                min-width: 0;
                padding-right: 10px;
            }

            .top-banner .top-nav,
            .second-top-banner {
                display: none;
            }

            .hamburger {
                flex-shrink: 0;
            }

            #figure-stage {
                width: 140px;
                height: auto;
                aspect-ratio: 328.34791 / 231.51042;
                flex-shrink: 0;
            }

            #figure-stage svg {
                width: 100%;
                height: 100%;
            }

            .message-content {
                margin-left: 0;
                margin-right: 0;
                min-width: 0;
            }

            .message-words {
                font-size: 24px;
            }

            #cy-logo {
                width: 130px;
                margin-right: 0;
                transform: translateX(-40px);
            }

            .desktop-main-image {
                display: none;
            }

            .tablet-main-image {
                display: none;
            }

            .mobile-main-image {
                display: block;
                width: 100%;
                height: auto;
                margin: 0;
            }


        }

       .demo-notice {
    position: fixed;
    top: 45%;
    left: 50%;
    width: 50%;
    transform: translate(-50%, -50%) rotate(-45deg);
    background: rgba(239, 65, 56, 0.9);
    color: #fff;
    padding: 10px 60px;
    font-family: "Raleway", sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    white-space: nowrap;
    z-index: 9999;
    pointer-events: none;

    display: flex;
    justify-content: center;
}
    </style>

</head>

    <!-- // <button id="morph-button">Morph white → gray</button> -->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/MorphSVGPlugin.min.js"></script>
    <!-- Put your MorphSVGPlugin.min.js file here -->



    <script>
        gsap.registerPlugin(MorphSVGPlugin);

        const tl = gsap.timeline({ delay: 1 });

        gsap.set("#white-figure", {
            scale: 0.65,
            transformOrigin: "0% 35%"
        });

        tl.to("#white-figure", {
            duration: 1.5,
            scale: 0.7,
            morphSVG: "#gray-figure",
            fill: "#a9aaae",
            ease: "power2.inOut"
        })
            .to(".message-words", {
                duration: 0.5,
                opacity: 0,
                ease: "power2.inOut"
            })

            .to("#white-figure", {
                duration: 1.5,
                scale: 1.0,
                morphSVG: "#red-figure",
                fill: "#ef4138",
                ease: "power2.inOut"
            })
            .to("#cy-logo", {

                duration: 1.75,
                opacity: 1,
                ease: "power2.inOut"
            }, "<");
    </script>
